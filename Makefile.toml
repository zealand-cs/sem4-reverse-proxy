[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[tasks.build-log-ffi]
command = "cargo"
args = ["build", "-p", "log-ffi", "--release"]

[tasks.build-log-wasm]
command = "cargo"
args = ["build", "-p", "log-wasm", "--release", "--target", "wasm32-unknown-unknown"]

[tasks.run-demo-server]
command = "cargo"
args = ["run", "-p", "demo-server"]

[tasks.run-demo-proxy]
dependencies = [
	"build-log-ffi",
	"build-log-wasm",
]
command = "cargo"
args = ["run", "-p", "reverse-proxy", "--", "-c", "./configs/make.kdl", "-p", "8080"]

[tasks.example-proxy]
workspace = false
run_task = { name = ["run-demo-server", "run-demo-proxy"], parallel = true }

[tasks.bench-build]
dependencies = ["build-log-ffi", "build-log-wasm"]
script = '''
mkdir -p results
cargo build --release -p demo-server
cargo build --release -p reverse-proxy --no-default-features \
  --target-dir target/bench/no-plugins
cargo build --release -p reverse-proxy --no-default-features --features ffi \
  --target-dir target/bench/ffi
cargo build --release -p reverse-proxy --no-default-features --features wasm \
  --target-dir target/bench/wasm
'''

[tasks.bench-startup]
workspace = false
dependencies = ["bench-build"]
script = '''
echo "Measuring startup time (time-to-first-byte)..."

./target/release/demo-server &
DEMO_PID=$!
trap 'kill $DEMO_PID 2>/dev/null; wait $DEMO_PID 2>/dev/null || true' EXIT
sleep 0.2

for cfg in no-plugins ffi wasm; do
  hyperfine --warmup 2 --runs 10 \
    --export-json "results/startup_${cfg}.json" \
    "bash -c './target/bench/${cfg}/release/reverse-proxy -c configs/bench-${cfg}.kdl -p 8080 > /dev/null 2>&1 & \
      P=\$!; until curl -sf http://localhost:8080/demo > /dev/null 2>&1; do sleep 0.01; done; \
      kill \$P 2>/dev/null; wait \$P 2>/dev/null; exit 0'"
done
exit 0
'''

[tasks.bench-throughput]
workspace = false
dependencies = ["bench-build"]
script = '''
rm -f results/memory_peak.txt

./target/release/demo-server &
DEMO_PID=$!
trap 'kill ${PROXY_PID:-} $DEMO_PID 2>/dev/null || true; wait $DEMO_PID 2>/dev/null || true' EXIT
sleep 0.2

for cfg in no-plugins ffi wasm; do
  ./target/bench/${cfg}/release/reverse-proxy -c configs/bench-${cfg}.kdl -p 8080 > /dev/null 2>&1 &
  PROXY_PID=$!
  until curl -sf http://localhost:8080/demo > /dev/null 2>&1; do sleep 0.01; done

  (while kill -0 $PROXY_PID 2>/dev/null; do
    grep VmRSS /proc/$PROXY_PID/status 2>/dev/null || true
    sleep 0.5
  done) > results/memory_${cfg}_samples.txt &
  SAMPLER_PID=$!

  oha -n 10000 -c 50 --no-tui -o results/load_${cfg}.json --output-format json http://localhost:8080/demo

  kill $SAMPLER_PID 2>/dev/null || true
  kill $PROXY_PID 2>/dev/null || true
  wait $PROXY_PID 2>/dev/null || true

  PEAK=$(sort -t: -k2 -n results/memory_${cfg}_samples.txt 2>/dev/null | tail -1)
  echo "${cfg}: ${PEAK}" >> results/memory_peak.txt
  sleep 0.1
done
exit 0
'''

[tasks.bench-all]
workspace = false
dependencies = ["bench-startup", "bench-throughput"]
script = '''
echo ""
echo "=== Benchmark results written to results/ ==="
ls -lh results/
'''
